name: Redraw profile figures

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 in Japan
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the figures changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Redraw profile figures" && git push)
